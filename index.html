<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude FM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude FM">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #d97757;
    --accent-dark: #b85c3e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #4a2a1f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    width: 100%;
    max-width: 420px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .cover {
    width: 100%;
    max-width: 420px;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    position: relative;
  }
  .cover iframe, #player { width: 100%; height: 100%; border: 0; display: block; }
  .info {
    width: 100%;
    max-width: 420px;
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title { font-size: 24px; font-weight: 700; }
  .subtitle { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    flex-shrink: 0;
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .live.on { color: #fff; background: rgba(217, 119, 87, 0.25); }
  .live.on .dot { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .bars {
    width: 100%;
    max-width: 420px;
    height: 36px;
    margin-top: 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3px;
  }
  .bars span {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.18);
    transition: height 0.3s;
  }
  .playing .bars span { background: var(--accent); animation: bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { height: 4px; } 50% { height: var(--h); } }

  .controls {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  button {
    background: none;
    border: 0;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  button svg { fill: currentColor; }
  .side { width: 44px; height: 44px; color: var(--muted); }
  .side:active { color: var(--text); }
  .play {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--text);
    color: #000;
    transition: transform 0.1s;
  }
  .play:active { transform: scale(0.94); }
  .play:disabled { opacity: 0.5; }

  .status {
    margin-top: 20px;
    min-height: 18px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    max-width: 420px;
  }
  footer {
    margin-top: auto;
    padding-top: 32px;
    font-size: 12px;
    color: #6a6a6a;
    text-align: center;
    max-width: 420px;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>Сейчас в эфире</header>

  <div class="cover"><div id="player"></div></div>

  <div class="info">
    <div>
      <div class="title">Claude FM</div>
      <div class="subtitle">music for thinking and building</div>
    </div>
    <div class="live" id="live"><span class="dot"></span>LIVE</div>
  </div>

  <div class="bars" id="bars"></div>

  <div class="controls">
    <button class="side" id="mute" aria-label="Звук">
      <svg id="muteIcon" width="26" height="26" viewBox="0 0 24 24"></svg>
    </button>
    <button class="play" id="play" aria-label="Играть" disabled>
      <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24"></svg>
    </button>
    <button class="side" id="reload" aria-label="Переподключиться">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div class="status" id="status">Загрузка…</div>

  <footer>
    Чтобы играло в других приложениях: откройте в Safari, разверните видео на весь экран и нажмите «картинка в картинке», затем смахните окошко за край экрана.<br><br>
    Эфир Anthropic с <a href="https://clau.de/radio">YouTube</a>
  </footer>

<script>
  const VIDEO_ID = "tRsQsTMvPNg";
  const CHANNEL_ID = "UCV03SRZXJEz-hchIAogeJOg";

  const ICONS = {
    play: '<path d="M8 5v14l11-7z"/>',
    pause: '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>',
    sound: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/>',
    muted: '<path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>'
  };

  const $ = (id) => document.getElementById(id);
  const playBtn = $("play"), muteBtn = $("mute"), statusEl = $("status"), liveEl = $("live");
  let player, playing = false, usedFallback = false;

  // Equalizer bars
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.style.setProperty("--h", (10 + Math.random() * 26) + "px");
    s.style.animationDelay = (Math.random() * -1.1) + "s";
    $("bars").appendChild(s);
  }

  function setPlaying(on) {
    playing = on;
    document.body.classList.toggle("playing", on);
    liveEl.classList.toggle("on", on);
    $("playIcon").innerHTML = on ? ICONS.pause : ICONS.play;
    playBtn.setAttribute("aria-label", on ? "Пауза" : "Играть");
  }

  function setMuteIcon() {
    const m = player && player.isMuted && player.isMuted();
    $("muteIcon").innerHTML = m ? ICONS.muted : ICONS.sound;
  }

  function createPlayer(useChannel) {
    if (player) player.destroy();
    // controls: 1 exposes the fullscreen button, which on iOS leads to Picture in Picture for background play.
    const vars = { playsinline: 1, autoplay: 0, controls: 1, fs: 1, rel: 0, modestbranding: 1 };
    const opts = {
      playerVars: vars,
      events: {
        onReady: () => {
          playBtn.disabled = false;
          statusEl.textContent = "Нажмите ▶, чтобы включить";
          setMuteIcon();
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) { setPlaying(true); statusEl.textContent = ""; }
          else if (e.data === YT.PlayerState.BUFFERING) statusEl.textContent = "Подключение…";
          else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) setPlaying(false);
        },
        onError: () => {
          // The stream's video ID changes when the broadcast restarts: fall back to the channel's current live stream.
          if (!usedFallback) { usedFallback = true; createPlayer(true); return; }
          setPlaying(false);
          statusEl.textContent = "Эфир сейчас недоступен. Попробуйте позже.";
        }
      }
    };
    if (useChannel) { opts.videoId = "live_stream"; vars.channel = CHANNEL_ID; }
    else opts.videoId = VIDEO_ID;
    // Recreate the container: destroy() removes the iframe.
    if (!$("player")) {
      const d = document.createElement("div");
      d.id = "player";
      document.querySelector(".cover").appendChild(d);
    }
    player = new YT.Player("player", opts);
  }

  window.onYouTubeIframeAPIReady = () => createPlayer(false);

  playBtn.addEventListener("click", () => {
    if (!player) return;
    if (playing) player.pauseVideo();
    else { player.unMute(); player.playVideo(); setMuteIcon(); }
  });

  muteBtn.addEventListener("click", () => {
    if (!player || !player.isMuted) return;
    player.isMuted() ? player.unMute() : player.mute();
    setTimeout(setMuteIcon, 50);
  });

  $("reload").addEventListener("click", () => {
    if (!window.YT || !YT.Player) return;
    playBtn.disabled = true;
    setPlaying(false);
    statusEl.textContent = "Переподключение…";
    usedFallback = true;
    createPlayer(true);
  });

  $("playIcon").innerHTML = ICONS.play;
  $("muteIcon").innerHTML = ICONS.sound;

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = () => { statusEl.textContent = "Не удалось загрузить YouTube. Проверьте интернет."; };
  document.head.appendChild(tag);
</script>
</body>
</html>
