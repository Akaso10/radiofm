<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude FM</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude FM">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #ffffff;
    --muted: #b3b3b3;
    --accent: #d97757;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #4a2a1f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100%;
    user-select: none;
    -webkit-user-select: none;
  }
  .wrap { width: 100%; max-width: 420px; }

  .tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tabs button {
    flex: 1;
    padding: 9px 0;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }
  .tabs button.active { background: var(--text); color: #000; }

  .cover {
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    position: relative;
  }
  .cover iframe, #player { width: 100%; height: 100%; border: 0; display: block; }
  .art {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: radial-gradient(circle at 30% 30%, #e08a6a, #7a3b28 60%, #2a1712);
    font-size: 64px;
  }
  .art img { width: 34%; border-radius: 22%; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  body.mode-lofi .art { display: grid; }
  body.mode-lofi #playerBox { visibility: hidden; }
  #playerBox { width: 100%; height: 100%; }

  .info {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title { font-size: 24px; font-weight: 700; }
  .subtitle { font-size: 15px; color: var(--muted); margin-top: 4px; }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    flex-shrink: 0;
  }
  .live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .playing .live { color: #fff; background: rgba(217, 119, 87, 0.25); }
  .playing .live .dot { background: var(--accent); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .stations { display: none; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  body.mode-lofi .stations { display: flex; }
  .stations button {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
  }
  .stations button.active { background: var(--accent); color: #fff; }

  .bars {
    height: 36px;
    margin-top: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 3px;
  }
  .bars span {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.18);
  }
  .playing .bars span { background: var(--accent); animation: bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 0%, 100% { height: 4px; } 50% { height: var(--h); } }

  .controls {
    margin-top: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
  }
  button {
    background: none;
    border: 0;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-family: inherit;
  }
  button svg { fill: currentColor; }
  .side { width: 44px; height: 44px; color: var(--muted); }
  .side:active { color: var(--text); }
  .play {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: var(--text);
    color: #000;
    transition: transform 0.1s;
  }
  .play:active { transform: scale(0.94); }
  .play:disabled { opacity: 0.5; }

  .status {
    margin-top: 18px;
    min-height: 18px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  footer {
    margin-top: auto;
    padding-top: 28px;
    font-size: 12px;
    line-height: 1.5;
    color: #6a6a6a;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs">
    <button id="tabClaude" class="active">Claude FM</button>
    <button id="tabLofi">Lofi · играет в фоне</button>
  </div>

  <div class="cover">
    <div id="playerBox"><div id="player"></div></div>
    <div class="art"><img src="icon.png" alt=""></div>
  </div>

  <div class="info">
    <div>
      <div class="title" id="title">Claude FM</div>
      <div class="subtitle" id="subtitle">music for thinking and building</div>
    </div>
    <div class="live"><span class="dot"></span>LIVE</div>
  </div>

  <div class="stations" id="stations"></div>

  <div class="bars" id="bars"></div>

  <div class="controls">
    <button class="side" id="mute" aria-label="Звук">
      <svg id="muteIcon" width="26" height="26" viewBox="0 0 24 24"></svg>
    </button>
    <button class="play" id="play" aria-label="Играть">
      <svg id="playIcon" width="32" height="32" viewBox="0 0 24 24"></svg>
    </button>
    <button class="side" id="reload" aria-label="Переподключиться">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </div>

  <div class="status" id="status">Загрузка…</div>
</div>

<footer class="wrap" id="footer"></footer>

<audio id="audio" preload="none" playsinline></audio>

<script>
  const VIDEO_ID = "tRsQsTMvPNg";
  const CHANNEL_ID = "UCV03SRZXJEz-hchIAogeJOg";

  const STATIONS = [
    { name: "REYFM Lofi", url: "https://listen.reyfm.de/lofi_128kbps.mp3", site: "https://reyfm.de" },
    { name: "laut.fm Lofi", url: "https://stream.laut.fm/lofi", site: "https://laut.fm/lofi" },
    { name: "0nlineradio Lo-Fi", url: "https://stream.0nlineradio.com/lo-fi", site: "https://0nlineradio.com" }
  ];

  const ICONS = {
    play: '<path d="M8 5v14l11-7z"/>',
    pause: '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>',
    sound: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/>',
    muted: '<path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12a9 9 0 0 0-7-8.77v2.06A7 7 0 0 1 19 12zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>'
  };

  const FOOTERS = {
    claude: 'Эфир Anthropic с <a href="https://clau.de/radio">YouTube</a>. В фоне не играет: YouTube разрешает это только с Premium.',
    lofi: 'Можно свернуть и играть в Brawl Stars: музыка продолжит играть. Пауза — в «Пункте управления».'
  };

  const $ = (id) => document.getElementById(id);
  const audio = $("audio"), playBtn = $("play"), statusEl = $("status");
  let mode = "claude", station = 0, playing = false;
  let player, ytReady = false, usedFallback = false;

  try {
    const saved = JSON.parse(localStorage.getItem("radiofm") || "{}");
    if (saved.mode === "lofi") mode = "lofi";
    if (Number.isInteger(saved.station) && STATIONS[saved.station]) station = saved.station;
  } catch (e) {}

  function save() {
    try { localStorage.setItem("radiofm", JSON.stringify({ mode, station })); } catch (e) {}
  }

  // Equalizer bars
  for (let i = 0; i < 28; i++) {
    const s = document.createElement("span");
    s.style.setProperty("--h", (10 + Math.random() * 26) + "px");
    s.style.animationDelay = (Math.random() * -1.1) + "s";
    $("bars").appendChild(s);
  }

  // Station chips
  STATIONS.forEach((st, i) => {
    const b = document.createElement("button");
    b.textContent = st.name;
    b.addEventListener("click", () => selectStation(i));
    $("stations").appendChild(b);
  });

  function setPlaying(on) {
    playing = on;
    document.body.classList.toggle("playing", on);
    $("playIcon").innerHTML = on ? ICONS.pause : ICONS.play;
    playBtn.setAttribute("aria-label", on ? "Пауза" : "Играть");
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
  }

  function isMuted() {
    return mode === "lofi" ? audio.muted : !!(player && player.isMuted && player.isMuted());
  }

  function setMuteIcon() {
    $("muteIcon").innerHTML = isMuted() ? ICONS.muted : ICONS.sound;
  }

  function render() {
    document.body.classList.toggle("mode-lofi", mode === "lofi");
    $("tabClaude").classList.toggle("active", mode === "claude");
    $("tabLofi").classList.toggle("active", mode === "lofi");
    [...$("stations").children].forEach((b, i) => b.classList.toggle("active", i === station));
    if (mode === "lofi") {
      $("title").textContent = STATIONS[station].name;
      $("subtitle").textContent = "lofi · chill · beats";
      playBtn.disabled = false;
    } else {
      $("title").textContent = "Claude FM";
      $("subtitle").textContent = "music for thinking and building";
      playBtn.disabled = !ytReady;
    }
    $("footer").innerHTML = FOOTERS[mode];
    setMuteIcon();
  }

  function stopAll() {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    if (player && player.pauseVideo) player.pauseVideo();
    setPlaying(false);
  }

  function setMode(m) {
    if (m === mode) return;
    stopAll();
    mode = m;
    statusEl.textContent = (m === "claude" && !ytReady) ? "Загрузка…" : "Нажмите ▶, чтобы включить";
    save();
    render();
  }

  // ---------- Lofi (plain audio stream: keeps playing in the background on iOS) ----------
  function playLofi() {
    const st = STATIONS[station];
    audio.src = st.url;
    statusEl.textContent = "Подключение…";
    audio.play().catch(() => {
      statusEl.textContent = "Не удалось включить. Нажмите ▶ ещё раз.";
      setPlaying(false);
    });
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: st.name,
        artist: "Lofi радио",
        album: "Claude FM",
        artwork: [{ src: "icon.png", sizes: "512x512", type: "image/png" }]
      });
    }
  }

  function selectStation(i) {
    station = i;
    save();
    render();
    if (playing) playLofi();
    else statusEl.textContent = "Нажмите ▶, чтобы включить";
  }

  audio.addEventListener("playing", () => { setPlaying(true); statusEl.textContent = ""; });
  audio.addEventListener("pause", () => { if (mode === "lofi") setPlaying(false); });
  audio.addEventListener("waiting", () => { if (mode === "lofi") statusEl.textContent = "Буферизация…"; });
  audio.addEventListener("error", () => {
    if (mode !== "lofi" || !audio.getAttribute("src")) return;
    // Station is down: try the next one.
    const next = (station + 1) % STATIONS.length;
    statusEl.textContent = STATIONS[station].name + " недоступна, переключаю…";
    station = next;
    save();
    render();
    playLofi();
  });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => { if (mode === "lofi") playLofi(); });
    navigator.mediaSession.setActionHandler("pause", () => { if (mode === "lofi") audio.pause(); });
    navigator.mediaSession.setActionHandler("nexttrack", () => { if (mode === "lofi") selectStation((station + 1) % STATIONS.length); });
    navigator.mediaSession.setActionHandler("previoustrack", () => { if (mode === "lofi") selectStation((station + STATIONS.length - 1) % STATIONS.length); });
  }

  // ---------- Claude FM (YouTube) ----------
  function createPlayer(useChannel) {
    if (player) player.destroy();
    if (!$("player")) {
      const d = document.createElement("div");
      d.id = "player";
      $("playerBox").appendChild(d);
    }
    const vars = { playsinline: 1, autoplay: 0, controls: 1, fs: 1, rel: 0, modestbranding: 1 };
    const opts = {
      playerVars: vars,
      events: {
        onReady: () => {
          ytReady = true;
          if (mode === "claude") { statusEl.textContent = "Нажмите ▶, чтобы включить"; render(); }
        },
        onStateChange: (e) => {
          if (mode !== "claude") return;
          if (e.data === YT.PlayerState.PLAYING) { setPlaying(true); statusEl.textContent = ""; }
          else if (e.data === YT.PlayerState.BUFFERING) statusEl.textContent = "Подключение…";
          else if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) setPlaying(false);
        },
        onError: () => {
          // The stream's video ID changes when the broadcast restarts: fall back to the channel's current live stream.
          if (!usedFallback) { usedFallback = true; createPlayer(true); return; }
          if (mode !== "claude") return;
          setPlaying(false);
          statusEl.textContent = "Эфир сейчас недоступен. Попробуйте вкладку Lofi.";
        }
      }
    };
    if (useChannel) { opts.videoId = "live_stream"; vars.channel = CHANNEL_ID; }
    else opts.videoId = VIDEO_ID;
    player = new YT.Player("player", opts);
  }

  window.onYouTubeIframeAPIReady = () => createPlayer(false);

  // ---------- Controls ----------
  playBtn.addEventListener("click", () => {
    if (mode === "lofi") {
      playing ? audio.pause() : playLofi();
    } else if (player && ytReady) {
      if (playing) player.pauseVideo();
      else { player.unMute(); player.playVideo(); }
    }
    setTimeout(setMuteIcon, 50);
  });

  $("mute").addEventListener("click", () => {
    if (mode === "lofi") audio.muted = !audio.muted;
    else if (player && player.isMuted) player.isMuted() ? player.unMute() : player.mute();
    setTimeout(setMuteIcon, 50);
  });

  $("reload").addEventListener("click", () => {
    if (mode === "lofi") { playLofi(); return; }
    if (!window.YT || !YT.Player) return;
    ytReady = false;
    setPlaying(false);
    statusEl.textContent = "Переподключение…";
    render();
    usedFallback = true;
    createPlayer(true);
  });

  $("tabClaude").addEventListener("click", () => setMode("claude"));
  $("tabLofi").addEventListener("click", () => setMode("lofi"));

  $("playIcon").innerHTML = ICONS.play;
  statusEl.textContent = mode === "lofi" ? "Нажмите ▶, чтобы включить" : "Загрузка…";
  render();

  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = () => { if (mode === "claude") statusEl.textContent = "Не удалось загрузить YouTube. Попробуйте вкладку Lofi."; };
  document.head.appendChild(tag);
</script>
</body>
</html>
